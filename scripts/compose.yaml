services:
  db:
    image: postgres:16
    container_name: async_job_postgres
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  
  web:
    build: .
    container_name: async_job_fastapi
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
    volumes:
      - ~/.aws:/root/.aws:ro
  worker:
    build: .
    container_name: async_job_worker
    command: python worker.py
    env_file:
      - .env
    depends_on:
      - db
    volumes:
      - ~/.aws:/root/.aws:ro

volumes:
  postgres_data: